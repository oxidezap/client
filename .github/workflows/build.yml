# Cross-platform binary build, called by both nightly.yml and release.yml so
# the artifact a tag ships is produced exactly like the one main produces.
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Version string embedded in artifact names
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide a working binary for the others;
      # the caller decides whether a partial set is publishable.
      fail-fast: false
      matrix:
        include:
          # 22.04, not latest: the binary links against the runner's glibc, and
          # this keeps the floor low enough for stable distributions.
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libfreetype6-dev

      - uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin oxidezap

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          staging="oxidezap-${{ inputs.version }}-${{ matrix.name }}"
          mkdir -p "$staging"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/oxidezap.exe" "$staging/"
          else
            cp "target/${{ matrix.target }}/release/oxidezap" "$staging/"
          fi
          cp README.md LICENSE "$staging/"
          # zip on Windows, tar.gz elsewhere: what each platform's users can
          # open without installing anything.
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$staging.zip" "$staging"
            echo "ASSET=$staging.zip" >> "$GITHUB_ENV"
          else
            tar czf "$staging.tar.gz" "$staging"
            echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: oxidezap-${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
