# Cross-platform binary build, called by both nightly.yml and release.yml so
# the artifact a tag ships is produced exactly like the one main produces.
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Version string embedded in artifact names
        required: true
        type: string

# Read-only, and a called workflow does not inherit the caller's permissions
# unless they are passed: building never needs to write to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide a working binary for the others;
      # the caller decides whether a partial set is publishable.
      fail-fast: false
      matrix:
        include:
          # 22.04, not latest: the binary links against the runner's glibc, and
          # this keeps the floor low enough for stable distributions.
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # Apple Silicon only. The macos-13 (Intel) pool queues for tens of
          # minutes on free runners, and an Intel build would hold the whole
          # nightly behind it. Intel Macs can be covered later by building both
          # targets here and joining them with `lipo`, at the cost of doubling
          # this job.
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # `--no-install-recommends`: what these headers recommend is
          # documentation and tooling nothing links against, and it is a
          # download and an unpack on every run of every job that needs them.
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libfreetype6-dev

      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: protoc

      # The registry and the git checkouts, and deliberately not `target/`.
      #
      # A repository gets 10 GB of Actions cache in total and GitHub evicts the
      # least recently used entry to stay under it. What the other workflows
      # write on a push to `main`, read off their own upload logs:
      #
      #   ci.yml   Check (Linux)     2.17 GB
      #   ci.yml   Check (Windows)   2.07 GB
      #   ci.yml   Check (macOS)     1.64 GB
      #   ci.yml   MSRV              0.87 GB
      #   pages.yml pages-wasm       1.14 GB
      #
      # Which is already 8 GB before this job writes a byte, and this job
      # writes three more — a release target directory under fat LTO with
      # `codegen-units = 1`, per platform. So the budget was being overrun on
      # every push, and what went missing rotated: across the pull requests
      # sampled while writing this, the macOS and Windows `Check` jobs
      # restored nothing on any of them, which is what turned a 3m49 Windows
      # job on `main` into 12m26 on the pull request twenty minutes later.
      #
      # There is no version of this that keeps all three. So this job keeps the
      # half of the cache that is cheap — the crates.io registry and the
      # `whatsapp-rust` git checkout — and gives up the half that is over
      # budget.
      #
      # It is a real trade rather than a free win, and the Windows job is where
      # it is worth stating: with its cache it restored for 2m05, built for
      # 7m51, and then spent 7m10 uploading — 9m15 of a 17m45 job moving a
      # cache around. Cold, it loses the 7m51 and gains a full release
      # compile; whether that job comes out ahead or behind is not something
      # this change can predict, and it is the one job here that nobody is
      # waiting on. What every pull request gains is not in doubt: a warm cache
      # on the two platforms where a cold one costs eight minutes.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
          cache-targets: "false"

      # Both binaries, because they are one product now: the front end owns no
      # WhatsApp session and starts `oxidezapd` beside itself when none is
      # running. Shipping the UI alone would ship something that cannot
      # connect to anything.
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin oxidezap --bin oxidezapd

      - name: Package the binaries for their platform
        shell: bash
        # Through the environment, not into the script. `release.yml` takes a
        # tag from `workflow_dispatch`, and an expression interpolated into a
        # `run:` block is substituted before bash ever sees it — quotes and
        # all. Validated as well as quoted, because the value also becomes a
        # file name.
        env:
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            *[!A-Za-z0-9._-]* | "" | -* | .*)
              echo "refusing a version that is not a plain name: $VERSION" >&2
              exit 1
              ;;
          esac
          # One archive per platform, and the platform is in its *file* name.
          # A directory would not do: `upload-artifact` stores a directory's
          # contents at the artifact root, and the publish jobs download every
          # platform with `merge-multiple`, so three sets of identically named
          # binaries would land on top of each other and only one platform
          # would survive into the release.
          out="oxidezap-$VERSION-$PLATFORM"
          mkdir -p "$out"
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv "target/$TARGET/release/oxidezap.exe" "$out/"
            mv "target/$TARGET/release/oxidezapd.exe" "$out/"
            7z a -tzip "$out.zip" "$out" > /dev/null
            echo "ASSET=$out.zip" >> "$GITHUB_ENV"
          else
            mv "target/$TARGET/release/oxidezap" "$out/"
            mv "target/$TARGET/release/oxidezapd" "$out/"
            # Preserving the execute bit, which the bare binaries never had:
            # an archive can carry it where a raw asset download cannot.
            chmod +x "$out/oxidezap" "$out/oxidezapd"
            tar -czf "$out.tar.gz" "$out"
            echo "ASSET=$out.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxidezap-${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
