# Cross-platform binary build, called by both nightly.yml and release.yml so
# the artifact a tag ships is produced exactly like the one main produces.
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Version string embedded in artifact names
        required: true
        type: string

# Read-only, and a called workflow does not inherit the caller's permissions
# unless they are passed: building never needs to write to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide a working binary for the others;
      # the caller decides whether a partial set is publishable.
      fail-fast: false
      matrix:
        include:
          # 22.04, not latest: the binary links against the runner's glibc, and
          # this keeps the floor low enough for stable distributions.
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # Apple Silicon only. The macos-13 (Intel) pool queues for tens of
          # minutes on free runners, and an Intel build would hold the whole
          # nightly behind it. Intel Macs can be covered later by building both
          # targets here and joining them with `lipo`, at the cost of doubling
          # this job.
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libfreetype6-dev

      - uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Both binaries, because they are one product now: the front end owns no
      # WhatsApp session and starts `oxidezapd` beside itself when none is
      # running. Shipping the UI alone would ship something that cannot
      # connect to anything.
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin oxidezap --bin oxidezapd

      - name: Name the binaries for their platform
        shell: bash
        run: |
          set -euo pipefail
          # A directory rather than the bare binary this used to be: the two
          # have to land beside each other, and upload-artifact zips whatever
          # it is given regardless.
          out="oxidezap-${{ inputs.version }}-${{ matrix.name }}"
          mkdir -p "$out"
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv "target/${{ matrix.target }}/release/oxidezap.exe" "$out/"
            mv "target/${{ matrix.target }}/release/oxidezapd.exe" "$out/"
          else
            mv "target/${{ matrix.target }}/release/oxidezap" "$out/"
            mv "target/${{ matrix.target }}/release/oxidezapd" "$out/"
          fi
          echo "ASSET=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: oxidezap-${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
