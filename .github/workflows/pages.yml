# The web front end, built to a static bundle and published to GitHub Pages.
#
# The bundle is the window and nothing else: it holds no session, opens no
# socket of its own, and needs no server to be *hosted*. It attaches to an
# `oxidezapd` the visitor runs themselves, which is what the deployed page
# says on its loading screen.
#
# Two things are published from one branch, `gh-pages`:
#
#   /            main, the live site
#   /pr/<n>/     one preview per open pull request, removed when it closes
#
# A preview shares the site's *origin*: an `Origin` is scheme, host and port,
# and a path is none of those. So `--web-allow`-ing the published site allows
# every preview beside it, unmerged code included. What keeps that from being
# a way in is that the origin is not the daemon's admission check — the token
# is, and it reaches a page only by someone pasting it, which is the same act
# as deciding to trust that page. Anyone who wants the two genuinely apart
# wants a second Pages site, not a second directory.
#
# A branch rather than the Pages *artifact* deployment, because an artifact
# replaces the whole site and there is no way to put a preview beside it. That
# is a repository setting: Settings → Pages → Build and deployment → Deploy
# from a branch → `gh-pages` / `(root)`.
name: Pages

on:
  push:
    branches: ["main"]
  # Buildable and previewable from a pull request: the build is the part that
  # breaks, and finding out at merge time is finding out late.
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialized on the branch being published to, not on the ref being built:
  # two runs pushing to `gh-pages` at once is a lost update, and a preview and
  # a release can finish at the same moment. Not `cancel-in-progress`, because
  # a half-finished publish is a broken site.
  group: pages-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build
    # A closed pull request has nothing to build; it only has a preview to
    # take down.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nightly, and not by preference. `-Z build-std` is nightly-only, and
      # the standard library has to be rebuilt with the atomics target feature
      # on: `gpui_web` runs its background executor on real workers, which
      # share memory through a `SharedArrayBuffer`, and the prebuilt std is
      # not compiled for that. `rust-src` is what build-std compiles from.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
          components: rust-src

      # The build script that embeds gpui-component's icons runs on the host,
      # and `waproto` generates code with protoc — both are host builds even
      # though the artifact is wasm.
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: protoc,trunk

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # A separate cache from CI's: a different target, a different
          # toolchain and a rebuilt std share nothing worth restoring.
          key: pages-wasm
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Where this build will be served from, which the generated glue has to
      # be told or it fetches the wasm from the account root and gets a 404.
      # A preview lives one directory deeper than the site.
      - name: Work out where this will be served from
        id: where
        run: |
          repo='${{ github.event.repository.name }}'
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            echo "public_url=/$repo/pr/${{ github.event.number }}/" >> "$GITHUB_OUTPUT"
            echo "target=pr/${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "public_url=/$repo/" >> "$GITHUB_OUTPUT"
            echo "target=." >> "$GITHUB_OUTPUT"
          fi

      - name: Build the bundle
        env:
          PUBLIC_URL: ${{ steps.where.outputs.public_url }}
        run: ./web/build.sh

      # Proof the artifact is the one the page will ask for: trunk rewrites
      # `index.html` to point at hashed file names, and a mismatch is a blank
      # page rather than a failed build.
      - name: Check the bundle is complete
        run: |
          test -f web/dist/index.html || { echo "no index.html"; exit 1; }
          test -f web/dist/coi-serviceworker.js || {
            echo "the service worker is missing: the page will load without"
            echo "cross-origin isolation and the window will have no executor"
            exit 1
          }
          for asset in $(grep -oE '(href|src)="[^"]*"' web/dist/index.html |
                         sed -E 's/.*="([^"]*)"/\1/' |
                         grep -vE '^(https?:)?//'); do
            file="web/dist/$(basename "$asset")"
            test -f "$file" || { echo "index.html references $asset, which is not in dist"; exit 1; }
          done
          echo "bundle contents:"
          ls -lh web/dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle
          path: web/dist
          retention-days: 1

  publish:
    name: Publish
    needs: build
    # Same-repository only. A pull request from a fork is given a read-only
    # token, and the way around that — `pull_request_target` — runs the base
    # branch's workflow with write access against the fork's code, which is
    # how a preview becomes a supply-chain hole. A fork's build still runs;
    # it just has nowhere to publish to.
    if: |
      github.event.action != 'closed' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Work out where this goes
        id: where
        run: |
          repo='${{ github.event.repository.name }}'
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            echo "target=pr/${{ github.event.number }}" >> "$GITHUB_OUTPUT"
            echo "url=https://${{ github.repository_owner }}.github.io/$repo/pr/${{ github.event.number }}/" >> "$GITHUB_OUTPUT"
          else
            echo "target=." >> "$GITHUB_OUTPUT"
            echo "url=https://${{ github.repository_owner }}.github.io/$repo/" >> "$GITHUB_OUTPUT"
          fi

      # Only the publishing script: this job does not build anything, and a
      # full checkout would just be another copy of the tree to keep out of
      # the way of the branch it is about to rewrite.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bundle
          path: bundle

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ steps.where.outputs.target }}
        run: |
          set -eu
          bash .github/scripts/publish-pages.sh "$TARGET"

      - name: Say where it is
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "### Web preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.where.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

  # A preview is only worth having if it goes away. The directory is removed
  # when the pull request closes, merged or not.
  take-down:
    name: Take the preview down
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Remove the preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-pages.sh --remove "pr/${{ github.event.number }}"
