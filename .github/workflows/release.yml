# Tagged release. Same build path as nightly; only the packaging differs.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a release for
        required: true
        type: string

# Read for everything by default; the publish job below raises its own to
# `contents: write`, which is the only thing here that needs it.
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}

  # The client as a page, packaged so it can be hosted without being built.
  web:
    uses: ./.github/workflows/web-bundle.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}

  publish:
    needs: [build, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Create on first run, upload on a re-run of the same tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "$TAG" --generate-notes
          fi
