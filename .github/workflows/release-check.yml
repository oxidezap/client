# Exercise the production packager without granting publication permissions.
name: Release artifacts
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: pr-${{ github.event.number }}
  verify-download:
    name: Verify downloaded release archives
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: oxidezap-*
          path: artifacts
          merge-multiple: true
      - name: Validate the downloaded set and checksums
        env:
          VERSION: pr-${{ github.event.number }}
        run: |
          set -euo pipefail
          for platform in linux-x86_64 linux-aarch64 macos-aarch64 windows-x86_64; do
            suffix=tar.gz
            if [ "$platform" = windows-x86_64 ]; then suffix=zip; fi
            python3 .github/scripts/check-release.py "artifacts/oxidezap-$VERSION-$platform.$suffix" "$VERSION" "$platform"
          done
          test "$(find artifacts -type f | wc -l)" -eq 4
          (cd artifacts && sha256sum oxidezap-* > checksums.sha256 && sha256sum -c checksums.sha256)
