# Exercise the production packager without granting publication permissions.
name: Release artifacts
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: pr-${{ github.event.number }}
  verify-download:
    name: Verify downloaded release archives
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oxidezap-*
          path: artifacts
          merge-multiple: true
      - name: Validate the downloaded set and checksums
        env:
          VERSION: pr-${{ github.event.number }}
        run: |
          set -euo pipefail
          for platform in linux-x86_64 linux-aarch64 macos-aarch64 windows-x86_64; do
            suffix=tar.gz
            if [ "$platform" = windows-x86_64 ]; then suffix=zip; fi
            python3 .github/scripts/check-release.py "artifacts/oxidezap-$VERSION-$platform.$suffix" "$VERSION" "$platform"
          done
          # The Linux packages from packaging/linux/package.sh, four per architecture.
          for arch in x86_64 aarch64; do
            for suffix in AppImage AppImage.zsync deb rpm; do
              test -s "artifacts/oxidezap-$VERSION-linux-$arch.$suffix"
            done
          done
          python3 - "artifacts/oxidezap-$VERSION-plugins.zip" <<'PYTHON'
          import sys
          from pathlib import PurePosixPath
          from zipfile import ZipFile

          with ZipFile(sys.argv[1]) as archive:
              names = archive.namelist()
              assert names and len(set(names)) == len(names), names
              for name in names:
                  path = PurePosixPath(name)
                  assert name == path.name and path.suffix == ".wasm", name
                  assert name != "template.wasm", name
                  with archive.open(name) as module:
                      assert module.read(8) == b"\0asm\x01\0\0\0", name
              assert archive.testzip() is None
          PYTHON
          test "$(find artifacts -type f | wc -l)" -eq 13
          (cd artifacts && sha256sum oxidezap-* > checksums.sha256 && sha256sum -c checksums.sha256)
