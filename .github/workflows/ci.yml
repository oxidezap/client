name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Least privilege. Nothing here writes to the repository, and a compromised
# action reaching a token that can is the whole risk; `contents: read` is what
# checkout needs and nothing beyond it. Stated rather than left to the
# repository default, which is a setting this file cannot see.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The target dir is restored from cache each run, so incremental state is
  # always cold: it cannot speed anything up and only inflates what gets
  # cached. (rust-cache sets this too; stating it here keeps the reason
  # visible next to the setting that depends on it.)
  CARGO_INCREMENTAL: "0"
  # Full DWARF is a quarter of the cached target dir and buys nothing here:
  # a panic's file and line come from `panic::Location`, which is compiled in
  # regardless, and line tables keep backtraces readable when RUST_BACKTRACE
  # is on. Measured on this workspace: 2.4 GB -> 1.8 GB, same build time.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
          # For the example plugins below. Stable's own wasm target: a plugin
          # needs no `build-std`, which is the whole reason it can be checked
          # here rather than beside the nightly web build.
          targets: wasm32-unknown-unknown
      # Installed rather than cached. The caching action decides for itself
      # whether a package is already present, and when it decides wrong it
      # says "No packages to install" and succeeds — so the job fails much
      # later, at the linker, with `unable to find library -lasound`. The
      # release build has always installed these plainly; this matches it.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # `--no-install-recommends`: what these headers recommend is
          # documentation and tooling nothing links against, and it is a
          # download and an unpack on every run of every job that needs them.
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libfreetype6-dev
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # The manifest's hash belongs in the key, because a profile setting
          # in it changes every dependency's fingerprint and rust-cache would
          # otherwise never notice.
          #
          # Its automatic key hashes `Cargo.lock`, `.cargo/config.toml` and
          # each *member* crate's manifest — not the root one, where the
          # profiles live. So changing `[profile.dev]` used to leave the key
          # identical while making every cached artifact useless: the restore
          # was a full match, cargo rebuilt all of it anyway, and rust-cache
          # then declined to save ("Cache up-to-date."), so the stale entry
          # was never replaced. Measured on `main` after the profile change
          # that introduced this: the Windows `Check` job went from 3m49 warm
          # to 11m17, and stayed there.
          #
          # Naming the root manifest here is what makes the key say what it
          # means. A `prefix-key` bump would fix today and leave the next
          # profile edit to rediscover it.
          key: ${{ hashFiles('Cargo.toml') }}
          # Keep the dependency build even when a lint or a test fails: the
          # failure is in our code, and throwing away everything it compiled
          # makes the next attempt pay for all of it again.
          cache-on-failure: "true"
          # Only main writes the cache. GitHub gives a repository 10 GB total
          # and evicts least-recently-used, so letting every PR save a ~4 GB
          # entry would push out the one branch every PR restores from.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      # --all-features so the chat store's `search` feature (FTS5) is covered;
      # a default-features run silently skips its index and query tests.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # The example plugins, which the workspace steps above compile no line
      # of: `examples/` is excluded from the root workspace so that a host
      # build does not fail at every `oxi_*` import. Nothing checked them, and
      # what that let through was a README whose build command produced a
      # module the daemon refused, and lints that had accumulated in code
      # meant to be copied. Three answers, each cheap against the cache this
      # job already holds: they lint and test on the host, they build for
      # wasm32 through the one task that knows to leave the web flags out,
      # and the module that comes out of that is loaded by the real host —
      # the host's `#[ignore]`d test, which is the only check anywhere that
      # what the SDK emits is what the loader expects.
      - name: Lint and test the example plugins on the host
        run: |
          for example in examples/*/; do
            cargo fmt --manifest-path "$example/Cargo.toml" --all -- --check
            cargo clippy --manifest-path "$example/Cargo.toml" --all-targets -- -D warnings
            cargo test --manifest-path "$example/Cargo.toml"
          done
      - name: Build the example plugins for wasm32 and load one in the host
        run: |
          for example in examples/*/; do
            cargo xtask plugin build "$example"
          done
          cargo test -p oxidezap-plugin-host --all-features -- --ignored

  # The repository's own tooling, which the workspace jobs above do not see.
  #
  # `xtask/` carries its own `[workspace]` — it has to build from a checkout of
  # that one directory, which is what lets the Pages publish job hold
  # `contents: write` over a sparse checkout instead of the whole tree — so
  # `cargo test --workspace` compiles none of it, exactly as it compiles none
  # of `examples/`. What is in there is the two most intricate pieces of logic
  # in the repository: a compare-and-swap against the `gh-pages` branch, and a
  # three-way "is this still wanted" whose one wrong reading is a deployment
  # that silently does not happen. They were shell, and had nothing testing
  # them.
  #
  # No system dependencies, no protoc and no cache: it has no dependencies at
  # all, and building it from cold is a couple of seconds.
  xtask:
    name: Check (xtask)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      # No git identity step: the publisher's end-to-end test drives a real
      # `git` against a bare repository in a temporary directory, and every
      # commit it makes goes through the repository-local `user.name` and
      # `user.email` the publisher itself sets. Verified with the global and
      # system configs pointed at /dev/null.
      - run: cargo fmt --manifest-path xtask/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path xtask/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path xtask/Cargo.toml

  # The platforms the release ships to, compiled and — for the crates where it
  # matters — run.
  #
  # Compiling was not enough. The IPC transport compiled on Windows for weeks
  # while deadlocking on it: a named pipe opened the ordinary way serializes
  # reads against writes, so the front end's first request after startup waited
  # on a read that was waiting for the answer to that request. No `cfg` was
  # wrong and nothing failed to build; the behaviour differed. Only running
  # something finds that.
  #
  # The GUI is excluded from the test step deliberately: its tests are pure
  # logic that the Linux job already runs, and linking the gpui tree three
  # times to learn nothing is most of this job's wall clock.
  #
  # Native runners rather than cross-compiling: `x86_64-pc-windows-msvc` needs
  # the MSVC libraries, and the point is to build the way the release does.
  cross:
    name: Check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide the answer for the other.
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-14
          - name: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # The root manifest's hash, for the reason spelled out over the
          # `Check` job: the profiles live there, a profile decides every
          # dependency's fingerprint, and rust-cache's automatic key does not
          # hash that file.
          key: check-${{ matrix.name }}-${{ hashFiles('Cargo.toml') }}
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --all-targets so tests and benches are compiled too: a `cfg`-gated
      # test that no longer builds is the same break as a `cfg`-gated module
      # that no longer builds.
      - run: cargo check --workspace --all-targets --all-features
      # And the ones that touch the platform actually run. `oxidezap-daemon`
      # is where the transport tests live, because they need both ends of it.
      - name: Test the platform-sensitive crates
        run: cargo test -p oxidezap-ipc -p oxidezap-daemon -p oxidezap-core --all-features

  # The web half, run in a browser rather than checked.
  #
  # This job exists because of what its absence let through. The whole of
  # `daemon::plugins::web` — the OPFS folder a page installs into, lists and
  # loads from — is `#[cfg(target_family = "wasm")]`, so `cargo test
  # --workspace` above does not compile a line of it, let alone run one. A
  # cast that no browser can satisfy (`dyn_into::<js_sys::IteratorNext>()`,
  # against a global that does not exist) therefore reached production with
  # every check in this file green: listing the folder failed on its first
  # step, and with it installing, listing and removing.
  #
  # Checking would not have caught it either — it compiled. Only running it
  # in a browser does, which is what `wasm-bindgen-test-runner` and a headless
  # Chrome are here for.
  web:
    name: Test (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
          # For the shared-view ban below. This action installs only what it
          # is told to, so an unnamed component is an absent one.
          components: clippy
      # `waproto` generates code with protoc, which is a host build even
      # though the artifact is wasm.
      #
      # The runner has to match the `wasm-bindgen` crate this workspace
      # resolves, exactly — the generated glue and the runner are two halves
      # of one version — so it is pinned here and moves when Cargo.lock does.
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: protoc,wasm-bindgen-cli@0.2.127
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Its own cache: a different target shares nothing with the Linux
          # job's, and pages.yml's is a nightly with a rebuilt std.
          # The root manifest's hash, for the reason spelled out over the
          # `Check` job: the profiles live there, a profile decides every
          # dependency's fingerprint, and rust-cache's automatic key does not
          # hash that file.
          key: web-test-${{ hashFiles('Cargo.toml') }}
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The shared-view ban, and the only place it can be checked: these
      # crates' browser bindings are compiled for no other target, so the
      # workspace `Check` job never sees a line of them. A `--shared-memory`
      # build makes every Rust slice a `SharedArrayBuffer` view, and the
      # specifications refuse those — which has cost three outages here, each
      # one compiling perfectly and throwing at run time. `clippy.toml` names
      # the banned spellings; this is what runs them.
      #
      # Only that rule, deliberately: these crates have never been clippy'd
      # for wasm and carry lints of their own (an `Arc` that is `!Send` is
      # what the single-threaded web design *is*). Adopting the whole surface
      # is a cleanup with its own PR; making this class impossible is not.
      - name: Refuse a shared view into a browser API
        env:
          RUSTFLAGS: --cfg web_sys_unstable_apis
        run: |
          cargo clippy -p oxidezap-audio -p oxidezap-session \
            --target wasm32-unknown-unknown -- \
            -A clippy::all -A warnings \
            -D clippy::disallowed_methods -D clippy::disallowed_types
      # Chrome and its driver are on the image already. `CHROMEWEBDRIVER` is
      # the directory holding the driver and the runner wants the binary, so
      # it is joined in the shell rather than in an `env:` expression — the
      # `env` context there holds only what this file defines, and an image
      # variable read through it comes out empty.
      - name: Test the web half in a browser
        env:
          # Web Locks — `navigator.locks`, which the install path takes so two
          # tabs cannot grow the same folder past its budget — are behind
          # web-sys's unstable gate. Setting `RUSTFLAGS` also replaces the
          # root config's flags for this target, which is right: those are the
          # web *front end's* atomics and shared memory, and a test module
          # built with them needs isolation headers this runner does not
          # serve.
          RUSTFLAGS: --cfg web_sys_unstable_apis
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          export CHROMEDRIVER="${CHROMEWEBDRIVER:-}/chromedriver"
          test -x "$CHROMEDRIVER" || CHROMEDRIVER=$(command -v chromedriver)
          cargo test -p oxidezap-daemon --lib --target wasm32-unknown-unknown

  # The library crates an embedder can depend on: the chat store, which lost
  # the MSRV job it had in whatsapp-rust when it moved here, and the IPC
  # protocol, which a front end outside this workspace compiles against. The
  # GUI is deliberately excluded: it tracks gpui's git HEAD, which has no MSRV
  # to promise. Keep this toolchain and workspace.package.rust-version in step.
  #
  # Which is why this job is not what decides the number. These three crates
  # build on less than they declare; the figure is the one the GUI forces on
  # the workspace it shares, and what this job proves is that the crates an
  # embedder compiles against still build at the version the manifest names.
  msrv:
    name: MSRV (library crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.95"
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # The root manifest's hash, for the reason spelled out over the
          # `Check` job: the profiles live there, a profile decides every
          # dependency's fingerprint, and rust-cache's automatic key does not
          # hash that file.
          key: msrv-${{ hashFiles('Cargo.toml') }}
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check -p oxidezap-chat-store -p oxidezap-core -p oxidezap-ipc --all-features
