<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- `user-scalable=0`: the canvas handles its own gestures, and a
         pinch-zoom over it would scale the whole page away from the pointer
         positions gpui is tracking. -->
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=0"
    />
    <meta name="color-scheme" content="dark light" />
    <title>oxidezap</title>

    <!-- The window itself. `data-bin` names the binary; wasm-bindgen turns
         its `main` into the module's start function.

         `href` because trunk looks for a manifest beside this file and there
         is none: the page is not a crate, it is how the front end is
         packaged. Pointing at the crate keeps the bundle's own files in one
         directory instead of scattering them through the workspace root.

         The `wasm-opt` parameters are the features this module is *built*
         with. wasm-opt validates before it optimizes and refuses anything it
         was not told to expect, so without them a release build fails on the
         first `memory.init` — "Bulk memory operations require bulk memory" —
         and again on the first atomic. They are not optimizations; they are
         the shape of the module. -->
    <link
      data-trunk
      rel="rust"
      href="../crates/gui/Cargo.toml"
      data-bin="oxidezap"
      data-bindgen-target="web"
      data-wasm-opt-params="--enable-bulk-memory --enable-threads --enable-mutable-globals --enable-nontrapping-float-to-int --enable-sign-ext"
    />

    <!-- Cross-origin isolation, which GitHub Pages cannot give us.
         `gpui_web` runs its background executor on real workers, and workers
         share memory through a `SharedArrayBuffer` — which a browser only
         hands to a page that is cross-origin isolated, and that requires two
         response headers a static host does not let us set. A service worker
         can add them to its own responses, which is what this does: the
         first load registers it and reloads once, and every load after that
         is already isolated.

         This is the only JavaScript in the build that is not wasm-bindgen's
         own generated glue, and it is here because the alternative is a
         header we have no way to send. -->
    <link data-trunk rel="copy-file" href="coi-serviceworker.js" />
    <script src="coi-serviceworker.js"></script>

    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        /* Behind the canvas until the first frame lands, and behind the
           notice below if it never does. Matches the product's own deepest
           surface so the load does not flash white. */
        background: #1a1b26;
        color: #a9b1d6;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
        -webkit-user-select: none;
        user-select: none;
      }

      /* Underneath the canvas, so it is what a visitor reads while the module
         downloads — and what they are left with if it cannot run at all. The
         canvas covers it completely once gpui has drawn a frame. */
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        z-index: -1;
      }

      #loading h1 {
        font-size: 1.25rem;
        font-weight: 600;
        color: #c0caf5;
      }

      #loading p {
        max-width: 34rem;
        font-size: 0.9rem;
      }

      #loading code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.85em;
        background: #24283b;
        padding: 0.15em 0.4em;
        border-radius: 0.25rem;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <h1>oxidezap</h1>
      <p>Starting the window…</p>
      <p>
        This page is the front end only. It talks to
        <code>oxidezapd</code> on your own machine — start it with
        <code>oxidezapd --web --web-allow https://&lt;this-origin&gt;</code>, or
        point this page somewhere else with <code>?daemon=ws://…</code>.
      </p>
    </div>
  </body>
</html>
