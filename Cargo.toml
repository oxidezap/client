# Workspace root. `crates/gui` is the only member today; the daemon
# (`oxidezapd`) and a TUI front end land beside it, which is why the front end
# is already a member instead of the root package.
[workspace]
members = [
    "crates/audio",
    "crates/chat-store",
    "crates/core",
    "crates/daemon",
    "crates/gui",
    "crates/ipc",
    "crates/plugin-abi",
    "crates/plugin-host",
    "crates/plugin-sdk",
    "crates/session",
    "crates/video",
]
# Example plugins build for `wasm32-unknown-unknown` and link against imports
# only the daemon provides, so they are not workspace members: `cargo build`
# here would try to link them for the host and fail at every `oxi_*` symbol.
# Each carries its own `[workspace]` table and is built with its own
# `cargo build --target wasm32-unknown-unknown`.
exclude = ["examples"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["João Lucas <jlucaso@hotmail.com>"]
repository = "https://github.com/oxidezap/client"

# Mirror the library's safeguards (see /clippy.toml): wacore::time instead of
# std clocks, portable-atomic for 64-bit atomics.
[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
# Diagnostics belong in `log`: a line on stdout is invisible to the journal
# and, in the daemon, competes with nothing that reads it. `clippy.toml`'s
# `allow-print-in-tests` is what keeps a measurement's `--nocapture` output
# legitimate, and it was configured here against lints nothing turned on.
print_stdout = "deny"
print_stderr = "deny"

[workspace.dependencies]

# Mirrored from the library workspace: the chat store was authored against
# these exact feature sets, and default-features would pull in backends it
# deliberately avoids.
anyhow = "1.0"
async-trait = "0.1"
buffa = { version = "0.9.1", default-features = false, features = ["json"] }
# `wasmbind` reads the clock from the browser's `Date` instead of
# `SystemTime`, which on `wasm32-unknown-unknown` is the std function that
# panics with "time not implemented on this platform" — and `Utc::now()` is
# how every message, receipt and chat row here is stamped, so without it the
# first thing a page does with a timestamp takes the whole task down. It is
# one of chrono's own defaults; `default-features = false` above is what
# switched it off. Named here rather than per-crate because the crates that
# ask for a clock are the same ones on both sides, and chrono declares
# `wasm-bindgen`/`js-sys` under a wasm-only target table, so a native build
# picks up nothing from it.
chrono = { version = "0.4", default-features = false, features = ["wasmbind"] }
diesel = { version = "2.3.11", default-features = false, features = ["sqlite", "r2d2", "32-column-tables"] }
diesel_migrations = { version = "2.3.2", default-features = false, features = ["sqlite"] }
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
# Wasm has no OS entropy source of its own: `getrandom` refuses to build for
# `wasm32-unknown-unknown` unless a backend is named, and everything under
# `wacore` that signs, pads or generates an id reaches for it. Declared here so
# the one crate every other one depends on can turn the backend on for the
# whole graph — features are additive, so naming it once is naming it
# everywhere.
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }
# The same problem one major behind. Both are in the graph — 0.4 under
# `wacore`, 0.2 under an older transitive dependency — and each refuses to
# build for the web until its own backend is named, so both have to be.
getrandom_02 = { package = "getrandom", version = "0.2", default-features = false, features = ["js"] }
log = "0.4"
oxidezap-audio = { path = "crates/audio" }
oxidezap-chat-store = { path = "crates/chat-store" }
oxidezap-core = { path = "crates/core" }
oxidezap-daemon = { path = "crates/daemon" }
oxidezap-ipc = { path = "crates/ipc" }
oxidezap-plugin-abi = { path = "crates/plugin-abi" }
oxidezap-plugin-host = { path = "crates/plugin-host" }
oxidezap-plugin = { path = "crates/plugin-sdk" }
oxidezap-session = { path = "crates/session" }
oxidezap-video = { path = "crates/video" }
portable-atomic = { version = "1", default-features = false, features = ["fallback"] }
# The Unix syscalls the daemon and the IPC crate need (flock, getuid, kill),
# as safe wrappers. Already in the tree transitively; declared because both
# crates import it directly, and it replaces hand-written `extern "C"` blocks.
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "net", "process"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false }
thiserror = "2.0.19"
tokio = { version = "1.53.1", default-features = false }
wacore = { git = "https://github.com/oxidezap/whatsapp-rust", branch = "main" }
wacore-binary = { git = "https://github.com/oxidezap/whatsapp-rust", branch = "main" }
waproto = { git = "https://github.com/oxidezap/whatsapp-rust", branch = "main" }

# The library and its satellites. One git source, one branch: cargo resolves
# every entry below to the SAME commit, so `cargo update` moves them together
# and no two crates can drift onto incompatible revisions. The exact commit is
# pinned in the committed Cargo.lock.
#
# `whatsapp-rust` re-exports wacore, wacore-binary and waproto wholesale, so
# anything already depending on it reaches them through that and does not
# declare them here. The satellites below stay because `oxidezap-core`,
# `-audio` and `-chat-store` deliberately do NOT depend on `whatsapp-rust`:
# they are domain types, device I/O and storage, and routing them through the
# client would drag the whole Tokio runtime, VoIP stack and transport into
# crates that need none of it. `SharedSqlite` is also not re-exported, so the
# chat store needs sqlite-storage directly regardless.
#
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", branch = "main", features = ["voip"] }
whatsapp-rust-sqlite-storage = { git = "https://github.com/oxidezap/whatsapp-rust", branch = "main" }

[profile.dev]
# gpui is unusably slow unoptimized; match zed's own dev profile for it.
[profile.dev.package.gpui]
opt-level = 3

[profile.release]
opt-level = 3
debug = false
# fat LTO + a single codegen unit is worth several MiB across a tree this size.
# It costs release build time, which is why the nightly job builds the same
# profile only on main rather than per PR.
lto = "fat"
codegen-units = 1
# gpui only reaches for catch_unwind in its test harness, so aborting loses no
# runtime recovery and drops the unwind tables.
panic = "abort"
strip = true
incremental = false

# Off-hot-path crates run per connection / sync / request, not per frame, so
# size-optimizing them shrinks the binary at no measurable cost. This mirrors
# the same sweep in whatsapp-rust's own manifest, because profile settings only apply
# from the workspace root, so consuming those crates by git does not inherit
# them. Media decode (image, openh264, symphonia, mp4) and the per-message
# crypto/protocol crates deliberately stay at opt-level 3.
# z = persistence, media HTTP and TLS PKI.
[profile.release.package.diesel]
opt-level = "z"
[profile.release.package.diesel_migrations]
opt-level = "z"
[profile.release.package.r2d2]
opt-level = "z"
[profile.release.package.whatsapp-rust-sqlite-storage]
opt-level = "z"
[profile.release.package.libsqlite3-sys]
opt-level = "z"
[profile.release.package.ureq]
opt-level = "z"
[profile.release.package.ureq-proto]
opt-level = "z"
[profile.release.package.whatsapp-rust-ureq-http-client]
opt-level = "z"
[profile.release.package.rustls-webpki]
opt-level = "z"
[profile.release.package.webpki-roots]
opt-level = "z"
[profile.release.package.http]
opt-level = "z"
# The desktop-integration and one-shot subsystems. None of these run per
# frame or per message: naga compiles shaders once at renderer start, the
# D-Bus stack carries notifications, keyring reads and accessibility events,
# SVG rasterization happens when an icon is first loaded, and the regex
# engines back syntax highlighting. Size-optimizing them costs nothing a user
# can perceive.
[profile.release.package.naga]
opt-level = "z"
[profile.release.package.zbus]
opt-level = "z"
[profile.release.package.zvariant]
opt-level = "z"
[profile.release.package.accesskit_unix]
opt-level = "z"
[profile.release.package.accesskit_atspi_common]
opt-level = "z"
[profile.release.package.accesskit_consumer]
opt-level = "z"
[profile.release.package.atspi-common]
opt-level = "z"
[profile.release.package.atspi-proxies]
opt-level = "z"
[profile.release.package.oo7]
opt-level = "z"
[profile.release.package.notify-rust]
opt-level = "z"
[profile.release.package.ashpd]
opt-level = "z"
[profile.release.package.usvg]
opt-level = "z"
[profile.release.package.resvg]
opt-level = "z"
[profile.release.package.rustybuzz]
opt-level = "z"
[profile.release.package.tiny-skia]
opt-level = "z"
[profile.release.package.regex-automata]
opt-level = "z"
[profile.release.package.regex]
opt-level = "z"
[profile.release.package.fancy-regex]
opt-level = "z"
[profile.release.package.syntect]
opt-level = "z"
[profile.release.package.markdown]
opt-level = "z"
[profile.release.package.html5ever]
opt-level = "z"
[profile.release.package.markup5ever]
opt-level = "z"
[profile.release.package.markup5ever_rcdom]
opt-level = "z"
# The charset tables `html5ever` decodes with. 130 KiB of Big5, GBK, JIS and
# KSX ideograph maps in `.rodata` alone, on a path that begins with pasting
# HTML into a message — which is to say, never in a frame.
[profile.release.package.encoding_rs]
opt-level = "z"

# The image formats `gpui` turns on and this application never decodes.
#
# `image` is declared here with `png`, `jpeg` and `webp` — the three WhatsApp
# actually sends — but features are additive and gpui takes the crate's whole
# default set, so EXR, TIFF, GIF, QOI, PNM, TGA, DDS, farbfeld and the colour
# management behind them are compiled in whatever this manifest asks for. They
# cannot be removed (nothing here owns that dependency edge) and they cannot
# be reached either: a decoder is selected by sniffing the bytes, and no byte
# in this application's media path has ever been an OpenEXR header. What
# `opt-level = "z"` costs is decode speed in a decoder that is never called.
#
# `exr` is also the largest single *datum* in the window: 131,076 bytes of
# `to_linear_table::TABLE`, which is DWA compression's transfer curve. That is
# not what this changes — a table is a table at every optimization level — but
# it is the reason to look at the crate at all.
[profile.release.package.exr]
opt-level = "z"
[profile.release.package.tiff]
opt-level = "z"
[profile.release.package.gif]
opt-level = "z"
[profile.release.package.qoi]
opt-level = "z"
[profile.release.package.color_quant]
opt-level = "z"
[profile.release.package.moxcms]
opt-level = "z"
[profile.release.package.zune-inflate]
opt-level = "z"
# Reached only by the parallel decoders above: `image`'s `rayon` feature is
# gpui's too, and the formats it parallelizes are the ones nothing here opens.
[profile.release.package.rayon]
opt-level = "z"
[profile.release.package.rayon-core]
opt-level = "z"

# Path tessellation for the SVG icons, beside the `usvg`/`resvg`/`tiny-skia`
# entries above that were already here: it runs when an icon is first
# rasterized and never again.
[profile.release.package.lyon_tessellation]
opt-level = "z"
[profile.release.package.lyon_path]
opt-level = "z"
[profile.release.package.lyon_geom]
opt-level = "z"
[profile.release.package.lyon_algorithms]
opt-level = "z"

# Finding the fonts, which happens once at startup. Drawing with them does
# not go through here — that is `swash`, `harfrust` and `skrifa`, which stay
# where they are.
[profile.release.package.fontdb]
opt-level = "z"
[profile.release.package.fontconfig-parser]
opt-level = "z"

# The X11 input method and the clipboard's X11 half: a keystroke's worth of
# work, on the platform where a Wayland session does none of it.
[profile.release.package.zed-xim]
opt-level = "z"
[profile.release.package.xim-ctext]
opt-level = "z"
[profile.release.package.xim-parser]
opt-level = "z"
[profile.release.package.x11-clipboard]
opt-level = "z"

# The tray, which is one icon and a menu of three items, redrawn when the
# connection state changes. 263 KiB of the daemon before this.
[profile.release.package.ksni]
opt-level = "z"

# The other two thirds of the regex engine the sweep already names. `regex`
# and `regex-automata` have been at "z" here from the start; `regex-syntax` is
# the parser that runs once per pattern and `aho-corasick` is the literal
# prefilter built from it, and leaving the pair out left 288 KiB at "3"
# underneath a "z" engine.
[profile.release.package.regex-syntax]
opt-level = "z"
[profile.release.package.aho-corasick]
opt-level = "z"

# Parsing an icon: the XML reader and the SVG value grammar under `usvg`,
# which has been at "z" since the sweep was written.
[profile.release.package.roxmltree]
opt-level = "z"
[profile.release.package.svgtypes]
opt-level = "z"
# URL parsing, which happens when a message turns out to contain a link.
[profile.release.package.url]
opt-level = "z"
# The bignum behind the keyring's RSA, on a path that runs when a secret is
# read and never again.
[profile.release.package.num-bigint-dig]
opt-level = "z"

# A plugin's module is *validated* once, at load, and then interpreted. Only
# the validator is here: `wasmi` itself runs a plugin's instructions and stays
# where it is.
[profile.release.package.wasmparser]
opt-level = "z"

# The certificate work at connect: parsing a chain, checking a name, and the
# self-signed pair a call's DTLS handshake generates. Once per connection and
# once per call, against a TLS record path (`rustls`, `ring`) that is
# untouched.
[profile.release.package.x509-parser]
opt-level = "z"
[profile.release.package.rcgen]
opt-level = "z"

# A call's signalling transports, which are not its media. DTLS is a handshake
# and then a key schedule nothing carries audio over, and SCTP is the data
# channel beside the RTP that does. `rtc-shared` and `rtc-crypto` are
# deliberately absent: SRTP protects every packet.
[profile.release.package.rtc-dtls]
opt-level = "z"
[profile.release.package.rtc-sctp]
opt-level = "z"

# The wire format, which the web profile below has always had at "z" and the
# desktop deliberately did not.
#
# What made the desktop different was the sentence that per-message code is
# hot; the measurement is that it is not, and that it is expensive. `waproto`
# is 2.3 MiB of the daemon's 19.1 MiB of `.text` — generated from a 590 KB
# descriptor — and its four largest functions are `Message::write_to`,
# `SyncActionValue::merge_to_limit`, `Message::compute_size` and four separate
# 72 KiB copies of `Message::clone`. None of that is a loop: it is one pass
# over one stanza, some hundreds of times a minute at the very busiest, and
# what `opt-level = "z"` withholds from it is inlining and vectorization of
# straight-line field dispatch. The one burst that is not per message — an
# appstate or history sync — is bounded by the network and the store, not by
# this.
[profile.release.package.waproto]
opt-level = "z"
[profile.release.package.buffa]
opt-level = "z"


# s, not z: these sit on a path a user can feel, but not one that runs per
# frame. Image decode happens once per attachment, the Wayland protocol
# marshals input events, and TLS runs at connect plus per record.
[profile.release.package.image]
opt-level = "s"
[profile.release.package.zune-jpeg]
opt-level = "s"
[profile.release.package.image-webp]
opt-level = "s"
[profile.release.package.png]
opt-level = "s"
[profile.release.package.wayland-client]
opt-level = "s"
[profile.release.package.wayland-backend]
opt-level = "s"
[profile.release.package.calloop]
opt-level = "s"

# s = data-path framing kept a notch faster than z.
[profile.release.package.rustls]
opt-level = "s"
[profile.release.package.tokio-websockets]
opt-level = "s"
[profile.release.package.whatsapp-rust-tokio-transport]
opt-level = "s"
[profile.release.package.wacore-appstate]
opt-level = "s"
[profile.release.package.chrono]
opt-level = "s"
[profile.release.package.serde_json]
opt-level = "s"
# The container and the codec behind a video attachment's audio track: `mp4`
# walks the boxes once, `symphonia` decodes AAC for as long as the video
# plays. Real work, on a path a user waits on — so "s" rather than the "z"
# above it.
[profile.release.package.mp4]
opt-level = "s"
[profile.release.package.symphonia]
opt-level = "s"
[profile.release.package.symphonia-core]
opt-level = "s"
[profile.release.package.symphonia-format-isomp4]
opt-level = "s"
[profile.release.package.symphonia-codec-aac]
opt-level = "s"
[profile.release.package.symphonia-metadata]
opt-level = "s"
# X11's protocol marshalling, which is the same shape of work `wayland-client`
# above is kept at "s" for, on the other of the two Linux backends.
[profile.release.package.x11rb]
opt-level = "s"
[profile.release.package.x11rb-protocol]
opt-level = "s"
# The graphics API in front of Vulkan, which is not the drawing. What is in
# these three is descriptor validation, resource tracking and the adapter
# enumeration a window does once at startup — the pixels are the GPU's and the
# shaders are `naga`'s, which this manifest has had at "z" all along. A frame
# here is a handful of instanced draws, so "s" costs bookkeeping rather than
# rendering; 1.1 MiB of the window sat at "3" for it.
[profile.release.package.wgpu]
opt-level = "s"
[profile.release.package.wgpu-core]
opt-level = "s"
[profile.release.package.wgpu-hal]
opt-level = "s"



# The same tree, built to be downloaded.
#
# `release` above is calibrated for the binary, where an optimization is paid
# for once at build time and collected at every frame afterwards. The web
# artifact is one 28 MiB module a visitor waits on before the first pixel and
# a browser then has to compile, so the same setting is the wrong one — and
# cargo has no per-target profiles, which is why this is a profile of its own
# rather than a `cfg`. `web/build.sh` selects it through trunk's
# `--cargo-profile`; nothing else uses it, and the desktop build is untouched.
#
# The measurements are at the rustc stage on this tree, against `release`
# (35,828,266 bytes), each on its own:
#
#   opt-level = "s"                     -11,196,329   (-31.3%)
#   waproto + buffa at "z"               -1,237,629    (-3.5%)
#
# The package overrides are not inherited from `release` — cargo copies the
# base settings and not the per-package table — so the ones that matter to
# *this* graph are repeated here. That is a much shorter list than the sweep
# above, which names the desktop: `ureq`, `zbus`, `accesskit_*`, `wayland-*`,
# `usvg`, `notify-rust` and `libsqlite3-sys` are not compiled for wasm at all
# (there it is `sqlite-wasm-rs`), so the sweep's coverage of this artifact was
# close to nil.
[profile.web]
inherits = "release"
opt-level = "s"

# The exception, and the only one. `gpui` draws every frame, it is the largest
# single crate in the shipped module at 10.6% of its code, and it is the one
# place where "fast" is worth more than "small".
[profile.web.package.gpui]
opt-level = 3

# z = the protocol. `waproto` is generated from a 590 KB descriptor and is the
# second-largest crate here; `buffa` is its encoder. Both are per message
# rather than per frame, and the manifest above deliberately keeps them at 3
# for the desktop — which is the right answer there and not here.
[profile.web.package.waproto]
opt-level = "z"
[profile.web.package.buffa]
opt-level = "z"

# And the rest of the protocol, for the same reason and only here. A page's
# scarcest resource is the bytes a visitor waits on before the first pixel,
# which is exactly the trade `opt-level = "s"` above this makes for the whole
# graph; these are the crates where the difference is worth naming, because
# they are large and because what they do is one pass over one stanza rather
# than anything in a loop. The desktop keeps them at "3": there the module is
# paid for once at build time.
#
# The ciphers are deliberately not in this list. `aes`, `sha2`, `hmac` and
# `curve25519-dalek` are separate crates and are left alone — a ratchet step
# is the one part of this that really is arithmetic in a loop.
[profile.web.package.wacore]
opt-level = "z"
[profile.web.package.wacore-binary]
opt-level = "z"
[profile.web.package.wacore-libsignal]
opt-level = "z"
[profile.web.package.wacore-noise]
opt-level = "z"
[profile.web.package.whatsapp-rust]
opt-level = "z"

# The same bundle with its symbols, which `WEB_PROFILE=debug ./web/build.sh`
# selects. It inherits `web` rather than `release` deliberately: a build you
# are diagnosing should be the build that misbehaved, so the only difference
# is that the names survive.
#
# `strip` and not `debug`: what a wasm flame graph and a panic trace read is
# the *name section*, which rustc emits unless it is stripped — and which
# `strip = true` removes before wasm-opt ever sees the module, which is why
# there are no Rust symbols in a profile of the published page and never were.
# Full DWARF would add source lines and tens of megabytes; the names are what
# was promised.
[profile.web-debug]
inherits = "web"
strip = "none"

# z = persistence and the one-shot subsystems, mirroring the sweep above for
# the members of it that actually reach this target.
[profile.web.package.diesel]
opt-level = "z"
[profile.web.package.diesel_migrations]
opt-level = "z"
[profile.web.package.whatsapp-rust-sqlite-storage]
opt-level = "z"
[profile.web.package.naga]
opt-level = "z"
[profile.web.package.regex]
opt-level = "z"
[profile.web.package.regex-automata]
opt-level = "z"
[profile.web.package.markdown]
opt-level = "z"
[profile.web.package.html5ever]
opt-level = "z"
[profile.web.package.markup5ever]
opt-level = "z"
[profile.web.package.markup5ever_rcdom]
opt-level = "z"
[profile.web.package.encoding_rs]
opt-level = "z"
[profile.web.package.syntect]
opt-level = "z"
[profile.web.package.fancy-regex]
opt-level = "z"

# The same image formats the desktop sweep names above, for the same reason:
# `gpui` turns the crate's whole default set on and a page decodes exactly
# three of them. `image` itself stays at the profile's "s" — a photo in a
# conversation goes through it.
[profile.web.package.exr]
opt-level = "z"
[profile.web.package.tiff]
opt-level = "z"
[profile.web.package.gif]
opt-level = "z"
[profile.web.package.qoi]
opt-level = "z"
[profile.web.package.color_quant]
opt-level = "z"
[profile.web.package.moxcms]
opt-level = "z"
[profile.web.package.zune-inflate]
opt-level = "z"
[profile.web.package.rayon]
opt-level = "z"
[profile.web.package.rayon-core]
opt-level = "z"

# The SVG icon path, which a page walks once per icon and then never again.
# None of these five were reached by the desktop sweep's copies — package
# overrides are not inherited through `inherits`, which is the whole reason
# this list exists — and all five are compiled for wasm.
[profile.web.package.usvg]
opt-level = "z"
[profile.web.package.resvg]
opt-level = "z"
[profile.web.package.tiny-skia]
opt-level = "z"
[profile.web.package.tiny-skia-path]
opt-level = "z"
[profile.web.package.rustybuzz]
opt-level = "z"
[profile.web.package.lyon_tessellation]
opt-level = "z"
[profile.web.package.lyon_path]
opt-level = "z"
[profile.web.package.lyon_geom]
opt-level = "z"
[profile.web.package.lyon_algorithms]
opt-level = "z"

# A plugin's module is validated once, at load. `wasmi` interprets it
# afterwards and stays at the profile's "s" — on a page it shares the one
# agent with the window, which is the argument for keeping it quick rather
# than small.
[profile.web.package.wasmparser]
opt-level = "z"

# The container and the audio codec behind a video attachment. Both are real
# work a visitor waits on, so they stay at the profile's "s"; they are named
# here only because the desktop's own entries for them do not reach this
# graph.
[profile.web.package.mp4]
opt-level = "s"
[profile.web.package.symphonia]
opt-level = "s"
[profile.web.package.symphonia-core]
opt-level = "s"
[profile.web.package.symphonia-format-isomp4]
opt-level = "s"
[profile.web.package.symphonia-codec-aac]
opt-level = "s"
[profile.web.package.symphonia-metadata]
opt-level = "s"
