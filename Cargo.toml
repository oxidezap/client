# Workspace root. `crates/gui` is the only member today; the daemon
# (`oxidezapd`) and a TUI front end land beside it, which is why the front end
# is already a member instead of the root package.
[workspace]
members = [
    "crates/audio",
    "crates/chat-store",
    "crates/core",
    "crates/daemon",
    "crates/gui",
    "crates/ipc",
    "crates/plugin-abi",
    "crates/plugin-host",
    "crates/plugin-sdk",
    "crates/session",
    "crates/video",
]
# Example plugins build for `wasm32-unknown-unknown` and link against imports
# only the daemon provides, so they are not workspace members: `cargo build`
# here would try to link them for the host and fail at every `oxi_*` symbol.
# Each carries its own `[workspace]` table and is built with its own
# `cargo build --target wasm32-unknown-unknown`.
exclude = ["examples"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["João Lucas <jlucaso@hotmail.com>"]
repository = "https://github.com/oxidezap/client"

# Mirror the library's safeguards (see /clippy.toml): wacore::time instead of
# std clocks, portable-atomic for 64-bit atomics.
[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
# Diagnostics belong in `log`: a line on stdout is invisible to the journal
# and, in the daemon, competes with nothing that reads it. `clippy.toml`'s
# `allow-print-in-tests` is what keeps a measurement's `--nocapture` output
# legitimate, and it was configured here against lints nothing turned on.
print_stdout = "deny"
print_stderr = "deny"

[workspace.dependencies]

# Mirrored from the library workspace: the chat store was authored against
# these exact feature sets, and default-features would pull in backends it
# deliberately avoids.
anyhow = "1.0"
async-trait = "0.1"
buffa = { version = "0.9.1", default-features = false, features = ["json"] }
# `wasmbind` reads the clock from the browser's `Date` instead of
# `SystemTime`, which on `wasm32-unknown-unknown` is the std function that
# panics with "time not implemented on this platform" — and `Utc::now()` is
# how every message, receipt and chat row here is stamped, so without it the
# first thing a page does with a timestamp takes the whole task down. It is
# one of chrono's own defaults; `default-features = false` above is what
# switched it off. Named here rather than per-crate because the crates that
# ask for a clock are the same ones on both sides, and chrono declares
# `wasm-bindgen`/`js-sys` under a wasm-only target table, so a native build
# picks up nothing from it.
chrono = { version = "0.4", default-features = false, features = ["wasmbind"] }
diesel = { version = "2.3.11", default-features = false, features = ["sqlite", "r2d2", "32-column-tables"] }
diesel_migrations = { version = "2.3.2", default-features = false, features = ["sqlite"] }
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
# Wasm has no OS entropy source of its own: `getrandom` refuses to build for
# `wasm32-unknown-unknown` unless a backend is named, and everything under
# `wacore` that signs, pads or generates an id reaches for it. Declared here so
# the one crate every other one depends on can turn the backend on for the
# whole graph — features are additive, so naming it once is naming it
# everywhere.
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }
# The same problem one major behind. Both are in the graph — 0.4 under
# `wacore`, 0.2 under an older transitive dependency — and each refuses to
# build for the web until its own backend is named, so both have to be.
getrandom_02 = { package = "getrandom", version = "0.2", default-features = false, features = ["js"] }
log = "0.4"
oxidezap-audio = { path = "crates/audio" }
oxidezap-chat-store = { path = "crates/chat-store" }
oxidezap-core = { path = "crates/core" }
oxidezap-daemon = { path = "crates/daemon" }
oxidezap-ipc = { path = "crates/ipc" }
oxidezap-plugin-abi = { path = "crates/plugin-abi" }
oxidezap-plugin-host = { path = "crates/plugin-host" }
oxidezap-plugin = { path = "crates/plugin-sdk" }
oxidezap-session = { path = "crates/session" }
oxidezap-video = { path = "crates/video" }
portable-atomic = { version = "1", default-features = false, features = ["fallback"] }
# The Unix syscalls the daemon and the IPC crate need (flock, getuid, kill),
# as safe wrappers. Already in the tree transitively; declared because both
# crates import it directly, and it replaces hand-written `extern "C"` blocks.
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "net", "process"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false }
thiserror = "2.0.19"
tokio = { version = "1.53.1", default-features = false }
wacore = { git = "https://github.com/oxidezap/whatsapp-rust", branch = "claude/voip-wasm-relay-seam" }
wacore-binary = { git = "https://github.com/oxidezap/whatsapp-rust", branch = "claude/voip-wasm-relay-seam" }
waproto = { git = "https://github.com/oxidezap/whatsapp-rust", branch = "claude/voip-wasm-relay-seam" }

# The library and its satellites. One git source, one branch: cargo resolves
# every entry below to the SAME commit, so `cargo update` moves them together
# and no two crates can drift onto incompatible revisions. The exact commit is
# pinned in the committed Cargo.lock.
#
# The branch is `claude/voip-wasm-relay-seam` rather than `main` while
# oxidezap/whatsapp-rust#1364 is open: that is what splits the library's VoIP
# runtime from its native UDP relay dialler and adds the
# `RelayTransportProvider` seam a page reaches a call through. It goes back to
# `main` when that lands. Every entry moves together, which is the rule this
# block exists for -- a per-crate `rev` is what produces "expected `Jid`, found
# `Jid`".
#
# `whatsapp-rust` re-exports wacore, wacore-binary and waproto wholesale, so
# anything already depending on it reaches them through that and does not
# declare them here. The satellites below stay because `oxidezap-core`,
# `-audio` and `-chat-store` deliberately do NOT depend on `whatsapp-rust`:
# they are domain types, device I/O and storage, and routing them through the
# client would drag the whole Tokio runtime, VoIP stack and transport into
# crates that need none of it. `SharedSqlite` is also not re-exported, so the
# chat store needs sqlite-storage directly regardless.
#
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", branch = "claude/voip-wasm-relay-seam", features = ["voip"] }
whatsapp-rust-sqlite-storage = { git = "https://github.com/oxidezap/whatsapp-rust", branch = "claude/voip-wasm-relay-seam" }

[profile.dev]
# gpui is unusably slow unoptimized; match zed's own dev profile for it.
[profile.dev.package.gpui]
opt-level = 3

[profile.release]
opt-level = 3
debug = false
# fat LTO + a single codegen unit is worth several MiB across a tree this size.
# It costs release build time, which is why the nightly job builds the same
# profile only on main rather than per PR.
lto = "fat"
codegen-units = 1
# gpui only reaches for catch_unwind in its test harness, so aborting loses no
# runtime recovery and drops the unwind tables.
panic = "abort"
strip = true
incremental = false

# Off-hot-path crates run per connection / sync / request, not per frame, so
# size-optimizing them shrinks the binary at no measurable cost. This mirrors
# the same sweep in whatsapp-rust's own manifest, because profile settings only apply
# from the workspace root, so consuming those crates by git does not inherit
# them. Media decode (image, openh264, symphonia, mp4) and the per-message
# crypto/protocol crates deliberately stay at opt-level 3.
# z = persistence, media HTTP and TLS PKI.
[profile.release.package.diesel]
opt-level = "z"
[profile.release.package.diesel_migrations]
opt-level = "z"
[profile.release.package.r2d2]
opt-level = "z"
[profile.release.package.whatsapp-rust-sqlite-storage]
opt-level = "z"
[profile.release.package.libsqlite3-sys]
opt-level = "z"
[profile.release.package.ureq]
opt-level = "z"
[profile.release.package.ureq-proto]
opt-level = "z"
[profile.release.package.whatsapp-rust-ureq-http-client]
opt-level = "z"
[profile.release.package.rustls-webpki]
opt-level = "z"
[profile.release.package.webpki-roots]
opt-level = "z"
[profile.release.package.http]
opt-level = "z"
# The desktop-integration and one-shot subsystems. None of these run per
# frame or per message: naga compiles shaders once at renderer start, the
# D-Bus stack carries notifications, keyring reads and accessibility events,
# SVG rasterization happens when an icon is first loaded, and the regex
# engines back syntax highlighting. Size-optimizing them costs nothing a user
# can perceive.
[profile.release.package.naga]
opt-level = "z"
[profile.release.package.zbus]
opt-level = "z"
[profile.release.package.zvariant]
opt-level = "z"
[profile.release.package.accesskit_unix]
opt-level = "z"
[profile.release.package.accesskit_atspi_common]
opt-level = "z"
[profile.release.package.accesskit_consumer]
opt-level = "z"
[profile.release.package.atspi-common]
opt-level = "z"
[profile.release.package.atspi-proxies]
opt-level = "z"
[profile.release.package.oo7]
opt-level = "z"
[profile.release.package.notify-rust]
opt-level = "z"
[profile.release.package.ashpd]
opt-level = "z"
[profile.release.package.usvg]
opt-level = "z"
[profile.release.package.resvg]
opt-level = "z"
[profile.release.package.rustybuzz]
opt-level = "z"
[profile.release.package.tiny-skia]
opt-level = "z"
[profile.release.package.regex-automata]
opt-level = "z"
[profile.release.package.regex]
opt-level = "z"
[profile.release.package.fancy-regex]
opt-level = "z"
[profile.release.package.syntect]
opt-level = "z"
[profile.release.package.markdown]
opt-level = "z"
[profile.release.package.html5ever]
opt-level = "z"

# s, not z: these sit on a path a user can feel, but not one that runs per
# frame. Image decode happens once per attachment, the Wayland protocol
# marshals input events, and TLS runs at connect plus per record.
[profile.release.package.image]
opt-level = "s"
[profile.release.package.zune-jpeg]
opt-level = "s"
[profile.release.package.image-webp]
opt-level = "s"
[profile.release.package.png]
opt-level = "s"
[profile.release.package.wayland-client]
opt-level = "s"
[profile.release.package.wayland-backend]
opt-level = "s"
[profile.release.package.calloop]
opt-level = "s"

# s = data-path framing kept a notch faster than z.
[profile.release.package.rustls]
opt-level = "s"
[profile.release.package.tokio-websockets]
opt-level = "s"
[profile.release.package.whatsapp-rust-tokio-transport]
opt-level = "s"
[profile.release.package.wacore-appstate]
opt-level = "s"
[profile.release.package.chrono]
opt-level = "s"
[profile.release.package.serde_json]
opt-level = "s"



# The same tree, built to be downloaded.
#
# `release` above is calibrated for the binary, where an optimization is paid
# for once at build time and collected at every frame afterwards. The web
# artifact is one 28 MiB module a visitor waits on before the first pixel and
# a browser then has to compile, so the same setting is the wrong one — and
# cargo has no per-target profiles, which is why this is a profile of its own
# rather than a `cfg`. `web/build.sh` selects it through trunk's
# `--cargo-profile`; nothing else uses it, and the desktop build is untouched.
#
# The measurements are at the rustc stage on this tree, against `release`
# (35,828,266 bytes), each on its own:
#
#   opt-level = "s"                     -11,196,329   (-31.3%)
#   waproto + buffa at "z"               -1,237,629    (-3.5%)
#
# The package overrides are not inherited from `release` — cargo copies the
# base settings and not the per-package table — so the ones that matter to
# *this* graph are repeated here. That is a much shorter list than the sweep
# above, which names the desktop: `ureq`, `zbus`, `accesskit_*`, `wayland-*`,
# `usvg`, `notify-rust` and `libsqlite3-sys` are not compiled for wasm at all
# (there it is `sqlite-wasm-rs`), so the sweep's coverage of this artifact was
# close to nil.
[profile.web]
inherits = "release"
opt-level = "s"

# The exception, and the only one. `gpui` draws every frame, it is the largest
# single crate in the shipped module at 10.6% of its code, and it is the one
# place where "fast" is worth more than "small".
[profile.web.package.gpui]
opt-level = 3

# z = the protocol. `waproto` is generated from a 590 KB descriptor and is the
# second-largest crate here; `buffa` is its encoder. Both are per message
# rather than per frame, and the manifest above deliberately keeps them at 3
# for the desktop — which is the right answer there and not here.
[profile.web.package.waproto]
opt-level = "z"
[profile.web.package.buffa]
opt-level = "z"

# The same bundle with its symbols, which `WEB_PROFILE=debug ./web/build.sh`
# selects. It inherits `web` rather than `release` deliberately: a build you
# are diagnosing should be the build that misbehaved, so the only difference
# is that the names survive.
#
# `strip` and not `debug`: what a wasm flame graph and a panic trace read is
# the *name section*, which rustc emits unless it is stripped — and which
# `strip = true` removes before wasm-opt ever sees the module, which is why
# there are no Rust symbols in a profile of the published page and never were.
# Full DWARF would add source lines and tens of megabytes; the names are what
# was promised.
[profile.web-debug]
inherits = "web"
strip = "none"

# z = persistence and the one-shot subsystems, mirroring the sweep above for
# the members of it that actually reach this target.
[profile.web.package.diesel]
opt-level = "z"
[profile.web.package.diesel_migrations]
opt-level = "z"
[profile.web.package.whatsapp-rust-sqlite-storage]
opt-level = "z"
[profile.web.package.naga]
opt-level = "z"
[profile.web.package.regex]
opt-level = "z"
[profile.web.package.regex-automata]
opt-level = "z"
[profile.web.package.markdown]
opt-level = "z"
[profile.web.package.html5ever]
opt-level = "z"
