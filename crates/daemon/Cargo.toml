[package]
name = "oxidezap-daemon"
description = "Background WhatsApp session with a tray presence and an IPC surface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "oxidezapd"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
log = { workspace = true }

oxidezap-core = { workspace = true }
oxidezap-ipc = { workspace = true }
# The log level, which a front end can change while this process runs: the
# same crate the window uses, so both read the one stored answer.
oxidezap-logging = { workspace = true }
oxidezap-plugin-host = { workspace = true }
oxidezap-session = { workspace = true }
portable-atomic = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
# What both targets have. The rest is per target below: `net` is `mio`, which
# says outright that it does not build for a page, and `fs`, `signal` and a
# multi-threaded runtime are the same kind of claim about the world.
tokio = { workspace = true, features = ["macros", "sync", "time", "io-util"] }
# The clock behind the pairing deadline and the local send id, through the
# library's pluggable TimeProvider rather than std (see /clippy.toml).
wacore = { workspace = true }
# `Jid` parsing: a group's sender is a participant, not the conversation, and
# only a real JID parse can tell those apart.
wacore-binary = { workspace = true }

# The process half. `fs` is for the web bridge, which serves a cached payload
# straight off disk; `net` and `signal` are the socket and the way a process
# is asked to stop. Declared rather than inherited: something else in the
# Linux-only half of the graph turns `fs` on, so a build there succeeded while
# macOS and Windows failed on `tokio::fs` not existing.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["fs", "net", "rt-multi-thread", "signal"] }
# The WebSocket handshake's accept key, which is a SHA-1 of the client's key
# and a fixed string, base64-encoded (RFC 6455 §4.2.2). Not a security
# construction — it exists so a cache cannot complete a handshake it did not
# understand — which is why SHA-1 is the right and only answer here.
base64 = "0.23"
# `SinkExt`/`StreamExt` over the WebSocket, which is a sink of messages
# rather than a byte stream.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# The web bridge's token, which is the whole of its admission check.
getrandom = { workspace = true }
sha1 = "0.11"
# No TLS: the bridge is a loopback endpoint, and a certificate a browser would
# accept is not something a daemon can produce. See `listener/web/` on what
# stands in for the peer check a Unix socket gets for free.
#
# Here rather than shared, and it is not only about size: it drags `rand`,
# whose `getrandom` refuses this target outright. A page has no WebSocket
# *server* to run — it is the thing that connects — so nothing is lost.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

# The page half. `getrandom_02` is named for the same reason the session and
# the chat store name it: an older `getrandom` comes in through the graph and
# refuses to build for this target until a backend is chosen, and only the
# crate that depends on it can choose one.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom_02 = { workspace = true }
# The claim a page makes on the account, which is the Web Locks API — the
# browser's own answer to "one of these at a time", and the same question the
# binary answers with a file lock. Bound from Rust like every other browser
# API in this tree.
futures-channel = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    # The transport between two tabs of one origin: this tab holds the
    # account, and the others are front ends onto it. See `listener/tab.rs`.
    "BroadcastChannel",
    "MessageEvent",
    # The origin's private filesystem, which is where a page keeps the
    # plugins it has been given. See `plugins/web.rs`.
    "DomException",
    "File",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemWritableFileStream",
    "Lock",
    "LockManager",
    "LockOptions",
    "Navigator",
    "StorageManager",
    "Window",
] }

# The one harness that can run this crate's browser half. Everything in
# `plugins/web.rs` is `web_sys` against a real OPFS, a real `LockManager` and a
# real `localStorage`; none of it can be exercised by `cargo test` on the host,
# which is how a total breakage of the plugin folder reached production with
# the review rounds all green. See `plugins/web/tests.rs`.
[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[dev-dependencies]
chrono = { workspace = true, features = ["std", "clock"] }
# The same synthetic chats and messages every crate above core tests against.
oxidezap-core = { workspace = true, features = ["fixtures"] }
# `start_paused`: the handshake deadline is ten seconds of wall clock, and a
# test that actually waited it out would be ten seconds of CI.
tokio = { workspace = true, features = ["test-util"] }

# StatusNotifierItem over D-Bus, which is what a modern Linux tray actually
# speaks. `tray-icon` would be cross-platform in one crate, but its default
# features pull GTK3 and libxdo: a whole toolkit for one icon, in a binary
# whose UI talks to wayland and wgpu directly. ksni reuses the zbus already in
# the tree. Other platforms get their own impl behind `tray::Tray`.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"

# The Unix syscalls the daemon makes directly: flock for the startup lock and
# getuid for the state directory's ownership check. Safe wrappers, so neither
# needs an `unsafe` block.
# The named pipe's security descriptor. Windows has no way to ask for a
# user-only endpoint other than building one, and its default grants read
# access to Everyone.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[lints]
workspace = true
