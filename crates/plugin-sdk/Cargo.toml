[package]
name = "oxidezap-plugin"
description = "Write an oxidezap plugin in Rust: typed events, commands and widgets over the raw wasm ABI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Nothing but the constant table, which compiles to no code at all. A plugin
# built on this carries the bytes of its own logic and almost nothing else,
# which is the point of the whole ABI.
[dependencies]
oxidezap-plugin-abi = { workspace = true }

# A host to run a plugin's handlers against under `cargo test`. Off by
# default and never in a plugin's own build: a `.wasm` links the real imports,
# and this needs `std` and a heap to record what was asked for.
[features]
testing = ["oxidezap-plugin-abi/std"]

[lints]
workspace = true
