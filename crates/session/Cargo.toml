[package]
name = "oxidezap-session"
description = "Headless WhatsApp session: connection, event stream, sends, store hydration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
async-channel = "2"
log = { workspace = true }

oxidezap-audio = { workspace = true }
oxidezap-chat-store = { workspace = true, features = ["search"] }
oxidezap-core = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time"] }

# The library, twice, because the two targets need different halves of it.
#
# Same git source and same branch as every other library crate — that rule is
# about revisions moving together, and these do. What differs is the feature
# set, which `workspace = true` can only add to: the defaults pull the Tokio
# transport, the ureq client and `tokio/net`, and `tokio/net` is `mio`, which
# says outright that it does not build for this target. So the browser build
# takes none of them and supplies its own through the library's own plugin
# traits.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
whatsapp-rust = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", branch = "main", default-features = false }
# Directly, because the library no longer re-exports it: `sqlite-storage` is
# one of the defaults dropped above. Same crate the chat store opens, and
# without the `bundled-sqlite` that wants a C toolchain — diesel supplies
# SQLite itself on this target.
whatsapp-rust-sqlite-storage = { git = "https://github.com/oxidezap/whatsapp-rust", branch = "main", default-features = false }
# The browser, bound from Rust: the WebSocket, `fetch` and `setTimeout` that
# stand in for the transport, the HTTP client and the runtime the defaults
# would have supplied.
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = "1"
futures-channel = "0.3"
getrandom = { workspace = true }
getrandom_02 = { workspace = true }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "BinaryType",
    "CloseEvent",
    "Event",
    "Headers",
    "MessageEvent",
    "Request",
    "RequestInit",
    "Response",
    "WebSocket",
    "Window",
] }

[lints]
workspace = true
