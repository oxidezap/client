[package]
name = "oxidezap-webcodecs-tests"
version = "0.0.0"
edition = "2024"
publish = false

# Used by ../../src/video/webcodecs.rs, imported through #[path] in lib.rs.
# cargo-machete does not scan that module outside this crate's directory.
[package.metadata.cargo-machete]
ignored = ["js-sys", "wasm-bindgen-futures", "web-sys"]

# The browser runner needs neither GPUI's shared memory nor its native tests.
[workspace]

[features]
benchmarks = []

[lib]
path = "lib.rs"
test = false
doctest = false

[[test]]
name = "readback"
path = "readback.rs"

[[test]]
name = "recovery"
path = "recovery.rs"

[[test]]
name = "transform"
path = "transform.rs"

[dependencies]
image = { version = "0.25.10", default-features = false }
smallvec = "1.16.4"
# Match the root lockfile and CI's wasm-bindgen-test-runner.
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "=0.3.106", features = [
    "VideoDecoder", "VideoDecoderConfig", "VideoDecoderInit", "VideoFrame",
    "DomRectReadOnly", "VideoPixelFormat", "VideoFrameCopyToOptions", "PlaneLayout",
    "EncodedVideoChunk", "EncodedVideoChunkInit", "EncodedVideoChunkType", "DomException",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3.79"
