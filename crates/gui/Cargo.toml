[package]
name = "oxidezap-gui"
description = "Unofficial WhatsApp client: GPUI front end"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# One entry point, two targets. Built for the host this is the desktop
# window; built for `wasm32-unknown-unknown` and run through `wasm-bindgen`
# the same `main` becomes the module's start function, which is what trunk
# builds from `web/index.html`.
[[bin]]
name = "oxidezap"
path = "src/main.rs"

[dependencies]
# The video's own audio track: `mp4` demuxes the container and `symphonia`
# decodes the AAC out of it. Both were desktop-only while the only caller was
# `video/native.rs`, which needs openh264 and so was a desktop path from
# end to end. That is the day the note beside them predicted: a page demuxes
# for `web_sys::VideoDecoder` now, and the container was never the problem
# there — the codec was. So they are shared, and they are real bytes in the
# bundle rather than something LTO removes, which is the cost of the feature.
# Voice notes are Opus and live in `oxidezap-audio`, so only the AAC codec and
# the ISO-MP4 reader are ever reachable; every other format symphonia can
# register is dead weight in the probe tables.
mp4 = "0.14"
symphonia = { version = "0.6", default-features = false, features = ["aac", "isomp4"] }
anyhow = { workspace = true }
chrono = { workspace = true, features = ["std", "clock"] }

# UI framework: GPUI upstream + gpui-component. gpui-component leaves its gpui
# dep unpinned (tracks zed HEAD), and cargo forbids [patch]-pinning a source to
# itself, so the rev pin lives in this workspace's committed Cargo.lock
# (`cargo update -p gpui --precise <rev>` to move it). Same-source everywhere =
# one gpui in the tree, no fork.
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
gpui-component = { git = "https://github.com/longbridge/gpui-component.git" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component.git" }

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Ordered maps for deterministic cache eviction
indexmap = "2"
log = { workspace = true }

oxidezap-audio = { workspace = true }
oxidezap-core = { workspace = true }
# The daemon's protocol, not the session itself: this front end has not owned
# a WhatsApp connection since the daemon took it over.
oxidezap-ipc = { workspace = true }
# The log level: one place decides where it is kept and how it is changed
# while the process runs, because the daemon reads the same answer.
oxidezap-logging = { workspace = true }
portable-atomic = { workspace = true }
# `image` and nothing else. The crate's defaults add two more renderers this
# file has never asked for — an SVG one and a `pic`/troff one — and the whole
# use of it is `render::<image::Luma<u8>>()` in `views/pairing.rs`, which is
# the `image` feature.
qrcode = { version = "0.14", default-features = false, features = ["image"] }
# `include-exclude` is not a default feature, and the icon set is selected
# with `#[include]`. It resolves on the host through another crate in the
# graph turning it on, and nothing does that for the web — where the same
# attributes then fail to compile rather than being quietly ignored.
rust-embed = { version = "8", features = ["include-exclude", "interpolate-folder-path"] }
# theme.json: the palette is data, so it needs a schema and a parser.
serde = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
smallvec = "1"
# Racing two futures, and nothing else. The executor-free half of `smol`,
# which is all the window ever used it for besides timers — and the only half
# that builds for a page, since `smol`'s timer is an epoll loop.
futures-lite = { version = "2", default-features = false, features = ["std"] }
# Channels only. The session runs in another process now, so nothing here
# needs a runtime to drive it.
tokio = { workspace = true, features = ["sync"] }

# `wacore::time` rather than std clocks, which /clippy.toml disallows, and
# `Jid` parsing for the header. The satellites directly rather than through
# `whatsapp-rust`, which re-exports both: a front end has not owned a session
# since the daemon took it over, and depending on the client to reach two type
# modules dragged the whole Tokio runtime, transport and VoIP stack in behind
# them — none of which a browser has, and none of which the window ever
# called.
wacore = { workspace = true }
wacore-binary = { workspace = true }

# The desktop window. Everything here needs an operating system underneath it:
# a windowing system to draw on, a sound card to open, a C decoder to link.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Timers, on a platform that has a reactor to run them on.
smol = "2"
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
openh264 = "0.9" # H.264 software decoder

# The one Win32 constant the daemon spawn names (`CREATE_NO_WINDOW`), and
# nothing else: process creation flags are std, and the value itself belongs
# to the OS rather than to a literal in the call.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

# The same window as a page. `gpui_platform` picks the web backend by target,
# so the dependency differs only in the features a browser has no use for —
# there is no font-kit, no X11 and no Wayland behind a canvas.
[target.'cfg(target_family = "wasm")'.dependencies]
# The daemon, as a library, because in a page it is not a process: there is no
# socket to reach one over and nothing to start. `embedded::start` is the same
# state hub, bridge and protocol a desktop front end talks to across a socket,
# running in this address space — so the rule this looks like it breaks holds
# exactly as before. There is one session per user, and the window owns none
# of it.
oxidezap-daemon = { workspace = true }
# One tab has to be able to tell itself apart from another; see `front_end_id`.
getrandom = { workspace = true }
# `setTimeout`, as a future, with the worker fallback the window's own copy
# never had. Web only: the desktop half of `platform::clock` is `smol`'s
# timer, which needs no runtime, and the shared one waits on a Tokio wheel the
# window has nowhere to put.
oxidezap-platform = { workspace = true }
# The oneshot behind "wait for the file dialog to end"; see `platform/plugins.rs`.
futures-channel = "0.3"
js-sys = "0.3"
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "Navigator",
    "UserActivation",
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "EventTarget",
    "CssStyleDeclaration",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlElement",
    # The file dialog a page installs a plugin through.
    "HtmlInputElement",
    "Location",
    "Node",
    "PageTransitionEvent",
    # The emoji face, fetched from beside `index.html` rather than embedded;
    # see `platform/fonts.rs`.
    "Response",
    "Storage",
    "StorageEvent",
    "Url",
    "Performance",
    "Window",
    # WebCodecs: the browser's own H.264 decoder, which is what stands in for
    # openh264 where there is no C toolchain. See `video/webcodecs.rs`.
    "VideoDecoder",
    "VideoDecoderConfig",
    "VideoDecoderInit",
    "VideoFrame",
    "DomRectReadOnly",
    "VideoPixelFormat",
    "VideoFrameCopyToOptions",
    "PlaneLayout",
    "EncodedVideoChunk",
    "EncodedVideoChunkInit",
    "EncodedVideoChunkType",
    "DomException",
] }

# The page's text system, on the host. `gpui_web` builds its own over
# `CosmicTextSystem::new_without_system_fonts`, so `platform/fonts.rs` can
# hold a browser-only failure under `cargo test` by building the same thing —
# the crate is already in the graph on every platform, and this only names it.
[dev-dependencies]
gpui_wgpu = { git = "https://github.com/zed-industries/zed", package = "gpui_wgpu" }
# The same synthetic chats and messages every crate above core tests against.
oxidezap-core = { workspace = true, features = ["fixtures"] }

[lints]
workspace = true
